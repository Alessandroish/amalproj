<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Playfair+Display:wght@400;500&family=Bad+Script&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden}
.p{position:relative;width:1080px;height:1350px;overflow:hidden}
.bg{position:absolute;inset:0;width:1080px;height:1350px;filter:contrast(1.14) saturate(1.12) brightness(.98)}
.red{color:#a8141b;background:linear-gradient(180deg,#c21c22,#951018);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.t1{position:absolute;left:0;right:0;top:355px;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:150px;line-height:1;letter-spacing:-1px}
.t1 span{font-size:205px;line-height:0}
.t2{position:absolute;left:0;right:0;top:445px;text-align:center;font-family:'Playfair Display',serif;font-weight:400;font-size:265px;line-height:1;transform:scaleX(.74) scaleY(1.12);transform-origin:top center;letter-spacing:-4px}
.scr{position:absolute;font-family:'Bad Script',cursive;color:rgba(125,78,48,.42);line-height:.9}
.verse{position:absolute;left:275px;right:275px;top:830px;text-align:center;font-family:'Montserrat',sans-serif;font-weight:500;font-size:25px;line-height:1.3;color:#9a0b0f}
.src{position:absolute;left:0;right:0;top:945px;text-align:center;font:700 20px 'Montserrat';color:#9a0b0f}
</style></head><body><div class="p">
<img class="bg" src="bg_clean.png">

<div class="scr" style="left:160px;top:462px;font-size:30px;transform:rotate(14deg)">Новый<br>год</div>
<div class="scr" style="left:770px;top:470px;font-size:42px;transform:rotate(22deg)">хиты<br>90-х</div>
<div class="scr" style="left:300px;top:640px;font-size:46px;line-height:.8;transform:rotate(-4deg)">танцуем<br>&nbsp;до<br>утра</div>
<div class="scr" style="left:300px;top:1010px;font-size:36px;transform:rotate(-12deg)">зеркальный<br>&nbsp;&nbsp;шар</div>
<div class="scr" style="left:600px;top:990px;font-size:54px;transform:rotate(-15deg)">Ностальгия<br>&nbsp;по 90-м</div>

<div class="t1 red"><span>Д</span>искотека</div>
<div class="t2 red">90-х</div>

<img class="bg" src="bg_clean.png" style="clip-path:ellipse(111px 114px at 217px 316px)">
<div class="verse">Встречаем Новый год под любимые хиты 90-х! Блёстки, зеркальный шар, кассеты и танцы до самого утра.</div>
<div class="src">Новогодняя вечеринка</div>
</div></body></html>
