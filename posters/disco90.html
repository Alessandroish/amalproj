<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Marck+Script&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden}
.p{position:relative;width:1080px;height:1350px;overflow:hidden;background:#6e0f12}
.fabric{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#a3191c 0%,#7a1013 55%,#3c0608 100%)}
svg.full{position:absolute;inset:0}
.abs{position:absolute}
.orn{position:absolute;border-radius:50%}
.orn:before{content:"";position:absolute;left:50%;top:-6%;width:22%;height:12%;margin-left:-11%;border-radius:3px;background:linear-gradient(90deg,#6b4c14,#f2dc90,#6b4c14)}
.gold{background:radial-gradient(circle at 32% 28%,#fff6d0 0,#f0c96a 18%,#b8862c 50%,#5a3a0c 100%)}
.redb{background:radial-gradient(circle at 32% 28%,#ffd6c6 0,#d8503c 20%,#8e1a14 55%,#3a0705 100%)}
.disco{position:absolute;border-radius:50%;
 background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0,rgba(255,255,255,.15) 14%,transparent 32%),
 repeating-linear-gradient(0deg,rgba(40,25,10,.45) 0 2px,transparent 2px 18px),
 repeating-linear-gradient(90deg,rgba(40,25,10,.45) 0 2px,transparent 2px 18px),
 conic-gradient(from 20deg,#e9dcc0,#9c8a6a,#fff3d6,#7d6a4a,#e0cfa8,#a89270,#f6ead0,#6e5c3e,#e9dcc0);
 box-shadow:inset -30px -40px 60px rgba(40,20,5,.85),inset 15px 15px 40px rgba(255,255,255,.3),0 20px 40px rgba(0,0,0,.5)}
.blur{filter:blur(7px)}
.t1{position:absolute;left:0;right:0;top:350px;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:150px;color:#b5161b;letter-spacing:-2px;
 text-shadow:0 2px 0 rgba(90,10,10,.15)}
.t2{position:absolute;left:0;right:0;top:480px;text-align:center;font-family:'Playfair Display',serif;font-weight:900;font-size:230px;color:#b5161b;line-height:1;
 transform:scaleY(1.25);transform-origin:top;letter-spacing:2px}
.scr{position:absolute;font-family:'Marck Script',cursive;color:rgba(130,80,40,.55);font-size:40px;line-height:.95}
.verse{position:absolute;left:250px;right:290px;top:850px;text-align:center;font-family:'Montserrat',sans-serif;font-weight:500;font-size:26px;line-height:1.3;color:#9c0f14}
.src{position:absolute;left:0;right:0;top:1000px;text-align:center;font:700 20px 'Montserrat';color:#9c0f14}
.badge{position:absolute;left:50%;top:180px;width:130px;height:130px;margin-left:-65px;border-radius:50%;
 background:radial-gradient(circle,#c11b20 0 58%,#e8c46a 59% 64%,#8e1015 65% 100%);box-shadow:0 0 0 4px #d9ae4f,0 6px 14px rgba(0,0,0,.35);
 display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffe9a8;font:700 11px 'Montserrat';letter-spacing:1px;text-align:center}
.badge b{font:900 38px 'Playfair Display';letter-spacing:0;line-height:1}
</style></head><body><div class="p">
<div class="fabric"></div>

<svg class="full" width="1080" height="1350">
 <defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
   <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3"/>
   <feDisplacementMap in="SourceGraphic" scale="55"/>
  </filter>
  <filter id="paper">
   <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="5" seed="9" result="n"/>
   <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .36  0 0 0 0 .16  0 0 0 1.6 -0.75" result="stain"/>
   <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2" result="g"/>
   <feColorMatrix in="g" type="matrix" values="0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .25 0" result="grain"/>
   <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="stain"/><feMergeNode in="grain"/></feMerge>
   <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <radialGradient id="pg" cx="50%" cy="48%" r="60%"><stop offset="0" stop-color="#fbf3e2"/><stop offset=".6" stop-color="#efdcb8"/><stop offset="1" stop-color="#c9a26a"/></radialGradient>
  <filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a0405" flood-opacity=".6"/></filter>
 </defs>
 <g filter="url(#sh)"><g filter="url(#rough)"><rect x="150" y="90" width="790" height="1180" fill="url(#pg)" filter="url(#paper)"/></g></g>
 <g id="specks" fill="#8a5a2a" opacity=".45"></g>
</svg>

<div class="badge"><span>НОВЫЙ ГОД</span><b>2027</b></div>

<!-- top-left: disco balls instead of pots -->
<div class="disco" style="left:105px;top:40px;width:210px;height:210px"></div>
<div class="disco" style="left:275px;top:70px;width:150px;height:150px;filter:brightness(.75)"></div>
<div class="orn gold" style="left:40px;top:230px;width:190px;height:190px"></div>

<!-- right ornaments -->
<div class="orn gold" style="right:90px;top:200px;width:150px;height:150px;box-shadow:0 0 40px rgba(255,210,120,.4)"></div>
<div class="orn redb" style="right:50px;top:430px;width:70px;height:70px"></div>

<!-- vinyl record leaning right (instead of the cane) -->
<svg class="abs" style="right:-190px;top:740px;transform:rotate(-18deg)" width="420" height="420" viewBox="0 0 420 420">
 <defs><radialGradient id="vg"><stop offset="0" stop-color="#2b2b2b"/><stop offset="1" stop-color="#0c0c0c"/></radialGradient>
 <linearGradient id="vs" x1="0" y1="0" x2="1" y2="1"><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".25"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
 <circle cx="210" cy="210" r="200" fill="url(#vg)"/>
 <g fill="none" stroke="#333" stroke-width="1.2" id="grooves"></g>
 <circle cx="210" cy="210" r="200" fill="url(#vs)"/>
 <circle cx="210" cy="210" r="70" fill="#b5161b"/><circle cx="210" cy="210" r="62" fill="none" stroke="#e8c46a" stroke-width="2"/>
 <text x="210" y="200" text-anchor="middle" font-family="Playfair Display" font-weight="900" font-size="30" fill="#ffe9a8">90-е</text>
 <text x="210" y="232" text-anchor="middle" font-family="Montserrat" font-weight="700" font-size="12" fill="#ffe9a8" letter-spacing="2">GREATEST HITS</text>
 <circle cx="210" cy="210" r="6" fill="#efdcb8"/>
</svg>

<!-- bottom ornaments -->
<div class="orn redb" style="left:30px;top:1010px;width:190px;height:190px"></div>
<div class="orn gold" style="left:190px;top:1110px;width:120px;height:120px;box-shadow:0 0 50px rgba(255,220,140,.7)"></div>
<div class="orn redb blur" style="left:-30px;top:1210px;width:200px;height:200px"></div>

<div class="scr" style="left:175px;top:650px;transform:rotate(-10deg);font-size:36px">танцуем<br>до утра</div>
<div class="scr" style="right:175px;top:300px;transform:rotate(12deg);font-size:36px">хиты<br>на кассетах</div>
<div class="scr" style="left:190px;top:270px;transform:rotate(-8deg);font-size:36px">старый добрый<br>Новый год</div>
<div class="scr" style="left:300px;top:1060px;transform:rotate(-8deg)">зеркальный<br>шар</div>
<div class="scr" style="right:180px;top:1090px;transform:rotate(-14deg);font-size:52px">Ностальгия</div>

<div class="t1">Дискотека</div>
<div class="t2">90-х</div>

<div class="verse">Новогодняя вечеринка в стиле 90-х: любимые хиты, блёстки, зеркальный шар и танцы до утра. Встречаем Новый год так, как умели только тогда!</div>
<div class="src">Дресс-код: яркие 90-е</div>

<svg class="full" width="1080" height="1350" id="fg"></svg>
</div>
<script>
let s=11;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
const sp=document.getElementById('specks');
for(let i=0;i<70;i++){sp.innerHTML+=`<circle cx="${170+r()*750}" cy="${110+r()*1140}" r="${.8+r()*3.5}"/>`}
const gr=document.getElementById('grooves');for(let k=80;k<198;k+=5)gr.innerHTML+=`<circle cx="210" cy="210" r="${k}"/>`;
// fir branches + dried grass, some blurred in foreground
const fg=document.getElementById('fg');
function branch(x,y,ang,len,blur,col){let h=`<g transform="translate(${x} ${y}) rotate(${ang})" ${blur?`style="filter:blur(${blur}px)"`:''}><line x1="0" y1="0" x2="${len}" y2="0" stroke="#5a3a1a" stroke-width="5"/>`;
 for(let t=0;t<len;t+=7){const l=60*(1-t/len*.7);for(const sg of[-1,1])h+=`<line x1="${t}" y1="0" x2="${t+l*.6}" y2="${sg*l}" stroke="${col[Math.floor(r()*col.length)]}" stroke-width="3" stroke-linecap="round"/>`}
 return h+'</g>'}
const green=['#2d5a2e','#3f7040','#1e4522'],straw=['#c9a46a','#e0c08a','#a88048'];
let out='';
out+=branch(-20,620,-30,190,0,green);out+=branch(-40,960,-55,260,0,straw);
out+=branch(1100,600,205,180,0,green);
out+=branch(-60,1360,-45,380,5,straw);out+=branch(700,1400,-75,360,6,straw);out+=branch(1140,1380,230,380,5,green);
out+=branch(1120,-40,150,420,8,straw);out+=branch(500,-60,110,300,9,straw);out+=branch(-40,-30,30,260,6,straw);
fg.innerHTML=out;
// gold beads
for(let i=0;i<14;i++){const L=r()<.5;fg.innerHTML+=`<circle cx="${L?30+r()*110:950+r()*110}" cy="${300+r()*700}" r="${6+r()*7}" fill="#c9973c" stroke="#7a5418"/>`}
// sparkles
for(let i=0;i<5;i++){const x=150+r()*800,y=200+r()*1000;fg.innerHTML+=`<path d="M${x} ${y-16}L${x+3} ${y-3}L${x+16} ${y}L${x+3} ${y+3}L${x} ${y+16}L${x-3} ${y+3}L${x-16} ${y}L${x-3} ${y-3}Z" fill="#fff6d0" opacity=".9"/>`}
</script></body></html>
