<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;800;900&display=swap" rel="stylesheet">
<style>
  body{background:#3a0306;font-family:Montserrat,sans-serif}
  .mesh{background:
    radial-gradient(60% 40% at 78% 14%, rgba(255,190,110,.28) 0%, transparent 70%),
    radial-gradient(70% 45% at 15% 45%, #e2382c 0%, transparent 70%),
    radial-gradient(80% 50% at 85% 70%, #b0141b 0%, transparent 70%),
    linear-gradient(180deg,#c21f21 0%,#9b0f16 50%,#4d0408 100%)}
  .gold{color:#f2c46a}
  .goldtxt{background:linear-gradient(180deg,#fff0c4 0%,#f2c46a 40%,#b8862c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<div id="poster" class="mesh relative w-[1080px] h-[1920px] mx-auto overflow-hidden text-white">

  <!-- noise -->
  <svg class="absolute inset-0 opacity-[.18] mix-blend-overlay" width="1080" height="1920">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <!-- decorative geometry (top 30%) -->
  <svg class="absolute inset-0" width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff0c4"/><stop offset=".5" stop-color="#f2c46a"/><stop offset="1" stop-color="#b8862c"/>
      </linearGradient>
      <radialGradient id="ball" cx="35%" cy="30%" r="75%">
        <stop offset="0" stop-color="#fff3cf"/><stop offset=".35" stop-color="#f2c46a"/><stop offset="1" stop-color="#7a5208"/>
      </radialGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="40"/></filter>
    </defs>

    <!-- warm glow -->
    <circle cx="700" cy="300" r="260" fill="#ffb15a" opacity=".22" filter="url(#soft)"/>

    <!-- geometric firs: outline triangles -->
    <g stroke="url(#g)" stroke-width="3" stroke-linejoin="round">
      <path d="M300 140 L430 420 L170 420 Z"/>
      <path d="M300 220 L470 520 L130 520 Z" opacity=".7"/>
      <path d="M300 300 L510 620 L90 620 Z" opacity=".45"/>
      <line x1="300" y1="620" x2="300" y2="660" />
    </g>
    <path d="M300 104 l9 22 23 2 -18 15 6 23 -20 -13 -20 13 6 -23 -18 -15 23 -2z" fill="url(#g)"/>

    <!-- hanging bauble + rings -->
    <line x1="760" y1="0" x2="760" y2="250" stroke="url(#g)" stroke-width="2"/>
    <circle cx="760" cy="350" r="100" fill="url(#ball)"/>
    <rect x="742" y="238" width="36" height="18" rx="3" fill="url(#g)"/>
    <ellipse cx="728" cy="312" rx="28" ry="14" fill="#fff" opacity=".45" transform="rotate(-30 728 312)"/>
    <circle cx="760" cy="350" r="160" stroke="url(#g)" stroke-width="1.5" opacity=".55"/>
    <circle cx="760" cy="350" r="215" stroke="url(#g)" stroke-width="1" opacity=".3"/>

    <!-- small dots / sparkles -->
    <g fill="#f2c46a">
      <circle cx="560" cy="150" r="5"/><circle cx="960" cy="560" r="4" opacity=".7"/>
      <circle cx="110" cy="250" r="3" opacity=".6"/><circle cx="980" cy="160" r="6" opacity=".8"/>
      <path d="M560 470 l4 14 14 4 -14 4 -4 14 -4 -14 -14 -4 14 -4z"/>
      <path d="M940 330 l3 10 10 3 -10 3 -3 10 -3 -10 -10 -3 10 -3z" opacity=".8"/>
    </g>

    <!-- wave separator -->
    <path d="M0 1310 C 200 1270, 380 1350, 540 1310 S 880 1270, 1080 1310" stroke="url(#g)" stroke-width="1.5" opacity=".45"/>
  </svg>

  <!-- MAIN TITLE -->
  <div class="absolute left-[90px] right-[90px] top-[740px]">
    <div class="gold text-[24px] font-semibold tracking-[.45em] uppercase">Новогоднее мероприятие</div>
    <h1 class="mt-6 font-black leading-[.9] tracking-[-.02em] text-[132px]">ДИСКОТЕКА</h1>
    <div class="font-black leading-[.85] tracking-[-.04em] text-[250px] goldtxt">90-х</div>
    <p class="mt-8 text-[34px] font-light text-white/90">Встречаем Новый год под любимые хиты</p>
  </div>

  <!-- INFO CARDS -->
  <div class="absolute left-[90px] right-[90px] top-[1370px] grid grid-cols-3 gap-5">
    <div class="rounded-3xl bg-black/20 border border-white/15 px-7 py-7 backdrop-blur flex flex-col h-[250px]">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#f2c46a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>
      <div class="mt-5 text-[25px] font-semibold leading-tight">Вокальные и&nbsp;танцевальные номера</div>
      <div class="mt-auto text-[18px] uppercase tracking-[.2em] gold">готовятся</div>
    </div>
    <div class="rounded-3xl bg-black/20 border border-white/15 px-7 py-7 backdrop-blur flex flex-col h-[250px]">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#f2c46a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
      <div class="mt-5 text-[25px] font-semibold leading-tight">Сценарий мероприятия</div>
      <div class="mt-auto text-[18px] uppercase tracking-[.2em] gold">готовится</div>
    </div>
    <div class="rounded-3xl bg-black/20 border border-white/15 px-7 py-7 backdrop-blur flex flex-col h-[250px]">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#f2c46a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
      <div class="mt-5 text-[25px] font-semibold leading-tight">Афиша</div>
      <div class="mt-auto text-[18px] uppercase tracking-[.2em] gold">в разработке</div>
    </div>
  </div>

  <!-- FOOTER: left caption, right brand / QR placeholder -->
  <div class="absolute left-[90px] bottom-[96px] text-[22px] text-white/70 leading-snug">
    Дата, время и место —<br>совсем скоро
  </div>
  <div class="absolute right-[90px] bottom-[90px] flex items-center gap-5">
    <div class="text-right text-[16px] uppercase tracking-[.25em] text-white/60 leading-relaxed">Новый год<br><span class="gold font-semibold">2027</span></div>
    <svg width="120" height="120" viewBox="0 0 120 120" fill="none">
      <rect x="1" y="1" width="118" height="118" rx="14" stroke="#f2c46a" stroke-width="2" stroke-dasharray="6 6" opacity=".8"/>
      <g fill="#f2c46a" opacity=".85">
        <rect x="18" y="18" width="26" height="26" rx="3"/><rect x="76" y="18" width="26" height="26" rx="3"/>
        <rect x="18" y="76" width="26" height="26" rx="3"/>
        <rect x="54" y="54" width="10" height="10"/><rect x="76" y="76" width="10" height="10"/>
        <rect x="92" y="88" width="10" height="14"/><rect x="54" y="80" width="10" height="22"/>
      </g>
    </svg>
  </div>
</div>
<script>document.fonts.ready.then(()=>setTimeout(()=>document.body.dataset.ready=1,300))</script>
</body>
