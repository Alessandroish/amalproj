<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Happy New Year 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Great+Vibes&family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2121; --red:#a3141d; --red2:#c41f2a; --wall:#efeee9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:736px;height:1308px;background:#ddd}
  .poster{
    position:relative;width:736px;height:1308px;overflow:hidden;
    background:
      radial-gradient(ellipse at 20% 8%, rgba(255,250,235,.95), transparent 45%),
      radial-gradient(ellipse at 50% 55%, rgba(255,255,255,.6), transparent 60%),
      radial-gradient(ellipse at 90% 100%, rgba(160,150,140,.35), transparent 55%),
      var(--wall);
    font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);
  }
  .grain{position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply;pointer-events:none}

  /* ---------- gold frames ---------- */
  .frame{
    position:absolute;padding:26px;
    background:
      repeating-linear-gradient(45deg, rgba(90,55,10,.25) 0 2px, transparent 2px 6px),
      repeating-linear-gradient(-45deg, rgba(255,240,180,.25) 0 2px, transparent 2px 7px),
      linear-gradient(135deg,#6b4310 0%,#e8c368 14%,#9a6a1c 28%,#f6dc8c 42%,#a8741f 58%,#e9c56b 72%,#7a4c12 88%,#d8ad52 100%);
    box-shadow:
      0 0 0 3px #5a370b,
      0 0 0 6px #e2bb5f,
      0 0 0 8px #6e4610,
      14px 22px 30px rgba(40,25,10,.45),
      4px 6px 8px rgba(40,25,10,.35);
  }
  .frame::before{
    content:"";position:absolute;inset:10px;
    border:5px solid transparent;
    background:
      repeating-radial-gradient(circle at 50% 50%, rgba(255,235,160,.6) 0 1.5px, rgba(90,55,10,.5) 1.5px 3.5px) border-box;
    -webkit-mask:linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0);
    mask:linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0);
    mask-composite:exclude;
  }
  .frame .inner{
    position:relative;width:100%;height:100%;overflow:hidden;
    box-shadow:0 0 0 3px #3f2606, 0 0 0 5px #d9b25a, inset 0 0 30px rgba(0,0,0,.7);
  }
  .frame .inner svg{display:block;width:100%;height:100%}

  .f-tl{left:-90px;top:-30px;width:180px;height:400px}
  .f-tr{right:-60px;top:-40px;width:140px;height:180px}
  .f-r{right:-110px;top:730px;width:190px;height:520px}
  .f-main{left:146px;top:432px;width:456px;height:520px}

  /* ---------- header ---------- */
  .brand{position:absolute;top:50px;left:0;right:0;text-align:center;letter-spacing:.18em}
  .brand small{display:block;font-size:12px;font-weight:600;color:#4a3d3a}
  .brand b{display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Playfair Display',serif;font-weight:600;font-size:21px;letter-spacing:.08em;margin:4px 0;color:#2b2121}
  .brand b i{font-style:normal;display:inline-block;width:24px;height:24px;border-radius:50%;border:2px solid #2b2121;position:relative}
  .brand b i::after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;font-size:12px}

  .h1{position:absolute;left:0;right:0;font-family:'Playfair Display',serif;font-weight:400;color:#3a2a2a;text-align:center;line-height:1;letter-spacing:.01em;text-shadow:0 2px 0 rgba(255,255,255,.6)}
  .h1.a{top:150px;font-size:118px;letter-spacing:.05em;padding-right:70px}
  .h1.b{top:268px;font-size:90px;letter-spacing:.02em}
  .ribbon{position:absolute;left:0;top:120px;width:736px;height:340px;pointer-events:none}
  .script{position:absolute;font-family:'Great Vibes',cursive;color:var(--red);text-shadow:1px 2px 2px rgba(80,0,0,.25)}
  .script.yr{right:40px;top:150px;font-size:104px;transform:rotate(-9deg)}

  /* ---------- polaroids ---------- */
  .pol{position:absolute;background:#fbfaf6;padding:10px 10px 30px;box-shadow:6px 12px 22px rgba(30,20,10,.38),0 1px 2px rgba(0,0,0,.3)}
  .pol svg{display:block}
  .pol.clock{right:-22px;top:372px;transform:rotate(7deg)}
  .pol.glass{left:-24px;top:870px;transform:rotate(-8deg)}

  /* ---------- sticky note ---------- */
  .note{position:absolute;left:90px;top:592px;width:150px;height:146px;transform:rotate(-6deg);
    background:linear-gradient(170deg,#fff3a6 0%,#f7e27a 70%,#eed465 100%);
    box-shadow:4px 10px 14px rgba(40,30,0,.35);font-family:'Caveat',cursive;color:#1f1a18;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.9;z-index:6}
  .note::after{content:"";position:absolute;right:0;bottom:0;width:26px;height:26px;background:linear-gradient(135deg,#e9cf5c 50%,rgba(0,0,0,.08) 50%)}
  .note .s1{font-size:40px;transform:rotate(-4deg)}
  .note .s2{font-size:50px;transform:rotate(-4deg);margin-top:2px}
  .pin{position:absolute;left:68px;top:-6px;width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ff8a8a,#d1121c 55%,#7d070c);box-shadow:3px 5px 4px rgba(0,0,0,.35)}

  /* ---------- verse ---------- */
  .verse{position:absolute;left:150px;right:150px;top:1050px;text-align:center;font-size:19.5px;line-height:1.32;color:#2b2121;font-weight:500}
  .verse .r{color:var(--red2)}
  .verse .c{position:relative;display:inline-block}
  .verse .c svg{position:absolute;left:-8px;top:-5px;width:calc(100% + 16px);height:calc(100% + 10px);overflow:visible}
  .verse b{font-weight:700}
  .handle{position:absolute;bottom:58px;left:0;right:0;text-align:center;font-family:Arial,sans-serif;font-size:13px;color:#444;letter-spacing:.02em}

  .snow,.flare{position:absolute;inset:0;pointer-events:none}
  .z{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="poster">

  <!-- wall texture -->
  <svg class="grain" width="736" height="1308"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .53  0 0 0 0 .5  0 0 0 .22 0"/></filter><filter id="n2"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="9"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .45  0 0 0 .18 0"/></filter><rect width="100%" height="100%" filter="url(#n2)"/><rect width="100%" height="100%" filter="url(#n)"/></svg>

  <!-- side frames -->

  <!-- header -->
  <div class="brand">

    <b><i></i>WINTER GALA<i></i></b>
    <small>31 · 12 · 2026</small>
  </div>

  <div class="h1 a">HAPPY</div>
  <div class="h1 b">NEW YEAR</div>

  <!-- red ribbon swirl -->

  <!-- MAIN FRAME: winter night scene -->
  <div class="frame f-main" style="z-index:3"><div class="inner"><svg viewBox="0 0 404 468" preserveAspectRatio="xMidYMid slice">

    </defs>
    <rect width="404" height="468" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#fff"><circle cx="40" cy="40" r="1.2"/><circle cx="90" cy="70" r=".9"/><circle cx="150" cy="30" r="1.1"/><circle cx="330" cy="50" r="1.3"/><circle cx="370" cy="110" r=".8"/><circle cx="280" cy="90" r=".9"/><circle cx="60" cy="130" r="1"/><circle cx="350" cy="180" r="1"/></g>

        <g fill="#fff1b8">

          <circle cx="180" cy="264" r="3"/><circle cx="205" cy="274" r="3"/><circle cx="235" cy="276" r="3"/><circle cx="265" cy="268" r="3"/>
          <circle cx="160" cy="343" r="3"/><circle cx="190" cy="354" r="3"/><circle cx="225" cy="358" r="3"/><circle cx="260" cy="354" r="3"/><circle cx="290" cy="345" r="3"/>
        </g>
        <g fill="#ffcc66" opacity=".7" filter="url(#b2)">
          <circle cx="200" cy="196" r="7"/><circle cx="250" cy="197" r="7"/><circle cx="205" cy="274" r="7"/><circle cx="265" cy="268" r="7"/><circle cx="190" cy="354" r="7"/><circle cx="260" cy="354" r="7"/>

        <!-- baubles -->
        <circle cx="212" cy="232" r="6" fill="#c41f2a"/><circle cx="246" cy="240" r="5" fill="#d9a63c"/><circle cx="185" cy="312" r="6" fill="#d9a63c"/><circle cx="270" cy="318" r="7" fill="#c41f2a"/><circle cx="225" cy="320" r="5" fill="#c41f2a"/>

  <!-- polaroid: midnight clock -->

    <defs>
      <radialGradient id="cb" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#3d2a1c"/><stop offset="1" stop-color="#0d0806"/></radialGradient>

<script>
  // deterministic snowflakes
  const s=document.getElementById('snow');let seed=7;const r=()=>((seed=(seed*16807)%2147483647)/2147483647);
  let h='';
  for(let i=0;i<130;i++){const x=r()*736,y=r()*1308,rad=.6+r()*2.4,o=.35+r()*.55;
    h+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(2)}" fill="#fff" opacity="${o.toFixed(2)}"/>`;}
  for(let i=0;i<14;i++){const x=r()*736,y=r()*1308,sz=4+r()*5;
    h+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" stroke="#fff" stroke-width=".9" opacity=".75"><path d="M0 -${sz}V${sz}M-${sz*.87} -${sz/2}L${sz*.87} ${sz/2}M-${sz*.87} ${sz/2}L${sz*.87} -${sz/2}"/></g>`;}
  s.innerHTML=h;
</script>
